name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Pinned: `ubuntu-latest` moves to 26.04 in late 2026 and says so on every run.
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No Claude/Codex credentials or CLIs: the deterministic suite needs none.
      - run: pnpm check
